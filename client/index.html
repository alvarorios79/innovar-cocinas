<!doctype html>
<html lang="es" translate="no">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>InnovarCocinas</title>
    <meta name="google" content="notranslate" />
    <meta name="description" content="Agenda citas y solicita estimados para cocinas integrales, closets, puertas y centros de TV en Pereira" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InnovarCitas" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var ua = navigator.userAgent;
        var log = [];
        var shown = false;

        function showDiag(msg) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root) return;
          // Only show if React didn't mount
          if (root.children.length > 0) return;
          shown = true;
          root.innerHTML =
            '<div style="padding:20px;font-family:monospace;font-size:13px;color:#0f0;background:#000;min-height:100vh;word-break:break-all">' +
            '<b style="color:#f00">ERROR — React no montó</b><br><br>' +
            '<b>UA:</b> ' + ua + '<br><br>' +
            '<b>Detalle:</b><br>' + msg + '<br><br>' +
            '<b>Log:</b><br>' + log.join('<br>') +
            '</div>';
        }

        // Catch module-level script errors (capture phase)
        document.addEventListener('error', function(e) {
          var src = (e.target && e.target.src) ? e.target.src : 'unknown-src';
          var msg = (e.message || '') + ' | src: ' + src;
          log.push('SCRIPT ERR: ' + msg);
          setTimeout(function(){ showDiag('Script error: ' + msg); }, 100);
        }, true);

        // Catch promise rejections
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'unknown';
          log.push('REJECT: ' + r);
        });

        // Catch general JS errors
        window.onerror = function(msg, src, line, col, err) {
          var detail = msg + ' @' + src + ':' + line + ':' + col;
          log.push('ERR: ' + detail);
        };

        // Timeout: if React not mounted in 10s, show diagnostics
        setTimeout(function() {
          var root = document.getElementById('root');
          if (!root || root.children.length === 0) {
            showDiag(log.length ? log.join(' | ') : 'Sin errores capturados — posible fallo silencioso al cargar módulos');
          }
        }, 10000);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r){ r.unregister(); });
          });
          if ('caches' in window) {
            caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
              .then(function(r){ console.log('SW registrado:', r); })
              .catch(function(e){ console.log('SW error:', e); });
          });
        }
      }
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
