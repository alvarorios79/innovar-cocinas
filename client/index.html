<!doctype html>
<html lang="es" translate="no">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>InnovarCocinas</title>
    <meta name="google" content="notranslate" />
    <meta name="description" content="Agenda citas y solicita estimados para cocinas integrales, closets, puertas y centros de TV en Pereira" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InnovarCitas" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Diagnóstico: captura error real del bundle via dynamic import() -->
    <script type="module">
    (async function() {
      // Esperar un momento para que el módulo estático intente cargarse
      await new Promise(function(r){ setTimeout(r, 3000); });
      var root = document.getElementById('root');
      if (root && root.children.length > 0) return; // React montó OK

      function showErr(msg) {
        if (!root || root.children.length > 0) return;
        root.innerHTML =
          '<div style="padding:20px;font-family:monospace;font-size:12px;background:#000;color:#0f0;min-height:100vh;word-break:break-all">' +
          '<b style="color:#f44">ERROR — React no montó</b><br><br>' +
          '<b>UA:</b> ' + navigator.userAgent + '<br><br>' +
          '<b>Error:</b><br>' + String(msg) +
          '</div>';
      }

      // Buscar el bundle principal en el DOM
      var scripts = document.querySelectorAll('script[type=module][src]');
      var mainSrc = null;
      for (var i = 0; i < scripts.length; i++) {
        var s = scripts[i];
        if (s.src && (s.src.indexOf('/assets/index-') !== -1 || s.src.indexOf('/src/main') !== -1)) {
          mainSrc = s.src;
          break;
        }
      }

      if (mainSrc) {
        try {
          // dynamic import() en Safari SÍ da el error real (a diferencia del event listener)
          await import(mainSrc);
          // Si llegó aquí sin error pero React no montó, es un problema de ejecución
          showErr('Bundle cargado sin error pero React no montó. URL: ' + mainSrc);
        } catch(e) {
          showErr((e && e.stack) ? e.stack : (e && e.message ? e.message : String(e)));
        }
      } else {
        showErr('No se encontró el bundle principal en el DOM. Scripts: ' +
          Array.from(document.querySelectorAll('script[src]')).map(function(s){ return s.src; }).join(', '));
      }
    })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r){ r.unregister(); });
          });
          if ('caches' in window) {
            caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
              .then(function(r){ console.log('SW registrado:', r); })
              .catch(function(e){ console.log('SW error:', e); });
          });
        }
      }
    </script>
  </body>

</html>
