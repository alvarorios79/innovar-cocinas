<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pizarra del Medidor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Diseño: barra de herramientas arriba, hoja cuadriculada que ocupa el resto, línea de ayuda al pie.
   La hoja siempre es papel blanco con cuadrícula azul, igual en tema claro u oscuro. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --fg: #17222d; --muted: #56667a; --line: #cfd8e1;
  --accent: #0b62c4; --accent-fg: #ffffff; --accent-soft: #dbeafb; --danger: #b3261e;
  --paper: #ffffff; --grid-minor: #d6e4f2; --grid-major: #a9c4de;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161c; --panel: #1a232c; --fg: #e6edf4; --muted: #9aaabb; --line: #2c3945;
    --accent: #5aa9f2; --accent-fg: #071522; --accent-soft: #1c3450; --danger: #f2867e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161c; --panel: #1a232c; --fg: #e6edf4; --muted: #9aaabb; --line: #2c3945;
  --accent: #5aa9f2; --accent-fg: #071522; --accent-soft: #1c3450; --danger: #f2867e;
  color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.35 var(--font-ui);
  display: flex; flex-direction: column; gap: 8px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.bar, .scalebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.grp.end { margin-left: auto; }
.btn {
  min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); font: 500 14px var(--font-ui); cursor: pointer;
  touch-action: manipulation;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.scalebar input[type="text"] {
  height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font: 500 14px var(--font-ui); padding: 0 10px; width: 210px; -webkit-user-select: text; user-select: text;
}
.scalebar input#who { width: 140px; }
.btn.sm { min-height: 36px; padding: 0 12px; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw {
  width: 44px; height: 44px; border-radius: 10px; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.sw i { width: 26px; height: 26px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sz { width: 40px; padding: 4px 0; display: grid; place-items: center; }
.sz i { border-radius: 50%; background: currentColor; }
.sz[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sz-slider { width: 76px; accent-color: var(--accent); cursor: pointer; vertical-align: middle; }
#szLbl { font-size: 12px; color: var(--muted); min-width: 2.5ch; font-variant-numeric: tabular-nums; }
/* ── Menu foto ───────────────────────────────────────────────────────────── */
#photoMenu {
  position: fixed; z-index: 180; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  min-width: 200px; flex-direction: column; gap: 2px; display: none;
  pointer-events: auto; -webkit-overflow-scrolling: touch;
}
.pm-btn {
  display: block; width: 100%; text-align: left; padding: 0 16px; min-height: 44px;
  border: none; background: transparent; color: var(--fg);
  font: 500 14px var(--font-ui); border-radius: 8px; cursor: pointer;
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
}
.pm-btn:hover, .pm-btn:active { background: var(--accent-soft); }
.pm-btn:disabled { opacity: .45; cursor: default; background: transparent; }
.pm-btn.pm-lock { font-weight: 600; }
.pm-btn.pm-danger { color: var(--danger); }
#pm-sep { height: 1px; background: var(--line); margin: 3px 0; }
#pm-confirm { padding: 6px 4px 2px; }
.pm-warn { font-size: 13px; color: var(--muted); margin: 0 0 8px; padding: 0 6px; line-height: 1.4; }
.scalebar { font-size: 13px; color: var(--muted); }
.scalebar label { display: inline-flex; align-items: center; gap: 6px; }
.scalebar input[type="number"], .scalebar select {
  height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font: 500 14px var(--font-num); padding: 0 8px;
}
.scalebar input[type="number"] { width: 78px; }
.scalebar input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.grow { flex: 1; }
.num { font-family: var(--font-num); min-width: 3.4em; text-align: center; color: var(--fg); }
#board {
  position: relative; flex: 1; min-height: 240px; border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden; background: var(--paper);
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
#txt {
  position: absolute; z-index: 3; min-width: 120px; padding: 2px 6px; border-radius: 6px;
  border: 1.5px dashed var(--accent); background: rgba(255,255,255,.94); color: #111827;
  font-family: var(--font-ui); font-weight: 600; outline: none; -webkit-user-select: text; user-select: text;
}
#txt.m { font-family: var(--font-num); text-align: center; transform: translate(-50%, -50%); width: 120px; }
#toastPz { position: absolute; z-index: 6; bottom: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 10px 16px; border-radius: 12px; background: #111827; color: #fff; font: 500 14px var(--font-ui); box-shadow: 0 4px 16px rgba(0,0,0,.3); text-align: center; pointer-events: none; }
#toastPz[hidden] { display: none; }
#toastPz.err { background: #b3261e; }
#pickBar { position: absolute; z-index: 4; top: 8px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: center; max-width: calc(100% - 16px); padding: 8px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 4px 16px rgba(0,0,0,.2); font-size: 13px; color: var(--fg); }
#pickBar[hidden] { display: none; }
#hint { font-size: 13px; color: var(--muted); min-height: 1.35em; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="bar" role="toolbar" aria-label="Herramientas de la pizarra">
  <div class="grp" role="group" aria-label="Herramienta">
    <button class="btn" data-tool="pen" aria-pressed="true">Lápiz</button>
    <button class="btn" data-tool="line" aria-pressed="false">Recta</button>
    <button class="btn" data-tool="measure" aria-pressed="false">Medir</button>
    <button class="btn" data-tool="text" aria-pressed="false">Texto</button>
    <button class="btn" data-tool="erase" aria-pressed="false">Borrar</button>
    <button class="btn" data-tool="move" aria-pressed="false">Mover</button>
    <button class="btn" data-tool="hand" aria-pressed="false">Mano</button>
  </div>
  <div class="grp" role="group" aria-label="Color">
    <button class="sw" data-color="#111827" style="--c:#111827" aria-label="Negro" aria-pressed="true"><i></i></button>
    <button class="sw" data-color="#d92d20" style="--c:#d92d20" aria-label="Rojo" aria-pressed="false"><i></i></button>
    <button class="sw" data-color="#1769d1" style="--c:#1769d1" aria-label="Azul" aria-pressed="false"><i></i></button>
    <button class="sw" data-color="#12805c" style="--c:#12805c" aria-label="Verde" aria-pressed="false"><i></i></button>
    <button class="sw" data-color="#b54708" style="--c:#b54708" aria-label="Naranja" aria-pressed="false"><i></i></button>
  </div>
  <div class="grp" role="group" aria-label="Grosor">
    <button class="btn sz" data-sz="1"  aria-label="1 px"  aria-pressed="false"><i style="width:2px;height:2px"></i></button>
    <button class="btn sz" data-sz="3"  aria-label="3 px"  aria-pressed="true" ><i style="width:5px;height:5px"></i></button>
    <button class="btn sz" data-sz="6"  aria-label="6 px"  aria-pressed="false"><i style="width:9px;height:9px"></i></button>
    <button class="btn sz" data-sz="12" aria-label="12 px" aria-pressed="false"><i style="width:14px;height:14px"></i></button>
    <button class="btn sz" data-sz="20" aria-label="20 px" aria-pressed="false"><i style="width:20px;height:20px"></i></button>
    <input type="range" id="szSlider" class="sz-slider" min="0.5" max="24" step="0.5" value="3" aria-label="Grosor exacto">
    <span id="szLbl">3</span>
  </div>
  <div class="grp" role="group" aria-label="Fotos">
    <button class="btn" id="shoot">Tomar foto</button>
    <button class="btn" id="gallery">Galería</button>
    <button class="btn danger" id="delSel" hidden>Quitar selección</button>
  </div>
  <div class="grp end" role="group" aria-label="Edición">
    <span id="verBadge" title="Versión de la pizarra" style="font:500 11px var(--font-num);color:var(--muted);padding:0 4px"></span>
    <select id="pdfArea" class="btn" aria-label="Qué parte de la hoja va al PDF" title="Qué parte de la hoja va al PDF" style="padding:0 8px">
      <option value="auto">PDF: automático (donde trabajé)</option>
      <option value="view">PDF: lo que veo en pantalla</option>
      <option value="pick">PDF: elegir un área</option>
    </select>
    <button class="btn primary" id="exportPdf">Exportar PDF</button>
    <button class="btn" id="undo" disabled>Deshacer</button>
    <button class="btn" id="redo" disabled>Rehacer</button>
    <button class="btn danger" id="clear">Limpiar</button>
  </div>
</header>

<div class="scalebar">
  <label for="job">Cliente / trabajo <input id="job" type="text" maxlength="80" placeholder="Ej. Casa Pérez, cocina" autocomplete="off"></label>
  <label for="who">Medidor <input id="who" type="text" maxlength="60" placeholder="Nombre" autocomplete="off"></label>
</div>
<div class="scalebar">
  <label for="cell">1 cuadro =
    <input id="cell" type="number" inputmode="decimal" min="0.01" step="0.05" value="0.5">
    <select id="unit" aria-label="Unidad"><option value="m">m</option><option value="cm">cm</option></select>
  </label>
  <label><input type="checkbox" id="snap" checked> Rectas y medidas a la cuadrícula</label>
  <label><input type="checkbox" id="holdOn" checked> Formas perfectas al mantener</label>
  <label><input type="checkbox" id="finger"> Dibujar con el dedo</label>
  <span class="grow"></span>
  <button class="btn sm" id="zout" aria-label="Alejar">−</button>
  <span class="num" id="zoomLbl">100%</span>
  <button class="btn sm" id="zin" aria-label="Acercar">+</button>
  <button class="btn sm" id="fit">Ajustar vista</button>
  <select id="gridModeBtn" title="Visibilidad de la cuadrícula" style="font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)">
    <option value="normal">□ Cuadrícula</option>
    <option value="dim">▫ Atenuada</option>
    <option value="hidden">☐ Ocultar</option>
  </select>
  <label title="Apoya una regla: ajusta hasta que el cuadro mida exactamente 5 mm" style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)">
    Calibrar <input type="range" id="cellPxSlider" min="10" max="60" step="1" value="26" style="width:60px;vertical-align:middle;accent-color:var(--accent)">
  </label>
</div>

<main id="board">
  <canvas id="cv" aria-label="Hoja de trabajo cuadriculada"></canvas>
  <div id="toastPz" hidden role="status"></div>
  <div id="pickBar" hidden>
    <span>Arrastra para marcar el área del PDF. Dos dedos mueven y acercan la hoja.</span>
    <button type="button" class="btn sm primary" id="pickOk">Generar PDF</button>
    <button type="button" class="btn sm" id="pickCancel">Cancelar</button>
  </div>
  <input id="txt" type="text" hidden autocomplete="off" autocapitalize="sentences" aria-label="Texto de la anotación">
</main>
<div id="hint" role="status"></div>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>
<div id="photoMenu" hidden role="menu" aria-label="Opciones de foto">
  <button type="button" class="pm-btn pm-lock" id="pm-lock">🔒 Bloquear foto</button>
  <div class="pm-sep2" style="height:1px;background:var(--line);margin:3px 0"></div>
  <button type="button" class="pm-btn" id="pm-dup">Duplicar (con anotaciones)</button>
  <button type="button" class="pm-btn" id="pm-dupclean">Duplicar sin anotaciones</button>
  <button type="button" class="pm-btn" id="pm-front">Traer al frente</button>
  <button type="button" class="pm-btn" id="pm-back">Enviar atrás</button>
  <div id="pm-sep"></div>
  <button type="button" class="pm-btn pm-danger" id="pm-del">Eliminar foto…</button>
  <div id="pm-confirm" hidden>
    <p class="pm-warn">¿Eliminar esta foto?<br><small>Las anotaciones encima permanecen.</small></p>
    <button type="button" class="pm-btn pm-danger" id="pm-delok">Sí, eliminar</button>
    <button type="button" class="pm-btn" id="pm-delno">Cancelar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const cv = $('#cv'), board = $('#board'), txt = $('#txt');
let ctx = cv.getContext('2d');
const hint = $('#hint'), zoomLbl = $('#zoomLbl'), delBtn = $('#delSel');
const CELL = 40, MAJOR = 5;
let cellPx = (() => { const s = +localStorage.getItem('pizarra-cellPx-v1'); return (s>=10&&s<=60)?s:(window.devicePixelRatio>=3?30:window.devicePixelRatio>=2?26:20); })();
let gridMode = 'normal';
const TEXT_SIZES = { 2: 18, 4: 26, 8: 38 };
// ── Umbrales del tachado — cambiar aquí para afinar la sensibilidad ────────
const SCRATCH = {
  MIN_TURNS:  3,    // inversiones de dirección mínimas (cada una > TURN_DEG°)
  TURN_DEG:  100,   // grados mínimos para contar una inversión
  MIN_PX:     30,   // longitud mínima del tachado en px de pantalla
  COMPACT:   1.8,   // pathLen debe ser > COMPACT × diagonal de la caja
  TOL_PX:     12,   // radio de detección en px de pantalla (en coordenadas del canvas)
  MIN_HITS:    2,   // puntos del tachado que deben tocar el elemento para marcarlo
  COVER_FRAC: 0.30, // alternativa: ≥30 % de muestras tocan el elemento → marcarlo
};
const HINTS = {
  pen: 'Lápiz: dibuja con el Apple Pencil o el mouse. Al terminar un trazo, mantén el lápiz quieto y se endereza en recta, rectángulo, triángulo o círculo. Un dedo mueve la hoja y dos dedos acercan.',
  line: 'Recta: arrastra de un punto a otro para trazar una línea derecha. Se alinea sola cerca de 0°, 45° y 90°.',
  measure: 'Medir: arrastra de un punto a otro. Al soltar, confirma la medida o escribe la real.',
  text: 'Texto: toca la hoja donde quieras escribir y pulsa Enter.',
  erase: 'Borrar: pasa sobre trazos, medidas o textos. Las fotos se quitan con Mover y «Quitar selección».',
  move: 'Mover: toca una foto para ver su menú (duplicar, eliminar…). Arrastra para moverla; la esquina inferior derecha cambia su tamaño. Dos dedos mueven y acercan la hoja.',
  hand: 'Mano: arrastra para desplazar la hoja. Con dos dedos puedes acercar y alejar.'
};
const CURS = { pen: 'crosshair', line: 'crosshair', measure: 'crosshair', text: 'text', erase: 'cell', move: 'default', hand: 'grab' };

// ── Parámetros desde URL (cuando se embebe en iframe) ──────────────────────
const _urlParams = new URLSearchParams(location.search);
const _levantamientoId = _urlParams.get('levantamientoId') || 'default';
const _jobParam  = _urlParams.get('job')  || '';
const _whoParam  = _urlParams.get('who')  || '';
const _dateParam = _urlParams.get('date') || '';
// La clave de almacenamiento es única por levantamiento
const KEY = 'pizarra-medidor-' + _levantamientoId;
const IDB_NAME = 'pizarra-medidor-' + _levantamientoId;
// ───────────────────────────────────────────────────────────────────────────

let view = { x: 24, y: 24, k: cellPx / CELL }, items = [], hist = [], redoS = [];
let tool = 'pen', color = '#111827', size = 3, cellVal = 0.5, unit = 'm', snap = true, fingerDraw = false;
// Grosor recordado por herramienta (pen/line/measure/erase/text)
let toolSizes = { pen: 3, line: 1.5, measure: 1.5, erase: 12, text: 3 };
let cur = null, sel = null, drag = null, nav = null, eraseRing = null, txtState = null, scratchPrev = null;
let penDown = false, lastPen = 0, dpr = 1, raf = 0, saveT = 0, confirmT = 0;
let holdOn = true, holdT = 0, holdAnchor = null, holdShape = false;
let pdfArea = 'auto', lastPick = null, pick = null;
const VERSION = 'v9.3';
const EMBEDDED = window.parent !== window;
const notifyParent = m => { if (EMBEDDED) { try { window.parent.postMessage({ ...m, levantamientoId: _levantamientoId }, '*'); } catch (_) {} } };
let job = _jobParam, who = _whoParam, DL = null, exporting = false, exportNum = null;
let T = { accent: '#0b62c4', paper: '#fff', minor: '#d6e4f2', major: '#a9c4de', num: 'monospace', ui: 'sans-serif' };
const ptrs = new Map(), imgs = new Map();

/* ---------- utilidades ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = n => n.toLocaleString('es', { maximumFractionDigits: 2 });
const segDist = (px, py, ax, ay, bx, by) => {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
};
function readTheme() {
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  T = { accent: g('--accent'), paper: g('--paper'), minor: g('--grid-minor'), major: g('--grid-major'), num: g('--font-num'), ui: g('--font-ui') };
  schedule();
}
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }
function measureLabel(a, b) {
  const v = Math.hypot(b[0] - a[0], b[1] - a[1]) / CELL * cellVal;
  return fmt(v) + ' ' + unit;
}
const toWorld = (sx, sy) => [(sx - view.x) / view.k, (sy - view.y) / view.k];
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function snapPt(p) { return snap ? [Math.round(p[0] / CELL) * CELL, Math.round(p[1] / CELL) * CELL] : p; }
function textFont(fs) { return `600 ${fs}px ${T.ui}`; }
function textSize() { return Math.max(12, Math.round(12 + size * 2.5)); }

/* ---------- geometría de elementos ---------- */
function bounds(it) {
  if (it.t === 's') {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const q of it.p) { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
    const w = it.p[0][2]; return [x0 - w, y0 - w, x1 + w, y1 + w];
  }
  if (it.t === 'm') return [Math.min(it.a[0], it.b[0]) - 8, Math.min(it.a[1], it.b[1]) - 8, Math.max(it.a[0], it.b[0]) + 8, Math.max(it.a[1], it.b[1]) + 8];
  if (it.t === 'l' || it.t === 'g') {
    const xs = it.p.map(q => q[0]), ys = it.p.map(q => q[1]);
    return [Math.min(...xs) - it.w, Math.min(...ys) - it.w, Math.max(...xs) + it.w, Math.max(...ys) + it.w];
  }
  if (it.t === 'e') return [it.x - it.rx - it.w, it.y - it.ry - it.w, it.x + it.rx + it.w, it.y + it.ry + it.w];
  if (it.t === 't') { ctx.font = textFont(it.fs); const w = ctx.measureText(it.s).width; return [it.x - 4, it.y - it.fs, it.x + w + 4, it.y + it.fs * 0.3]; }
  return [it.x, it.y, it.x + it.w, it.y + it.h];
}
function hit(it, x, y, tol) {
  if (it.t === 's') {
    const p = it.p;
    if (p.length === 1) return Math.hypot(x - p[0][0], y - p[0][1]) <= tol + p[0][2] / 2;
    for (let i = 1; i < p.length; i++) if (segDist(x, y, p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]) <= tol + p[i][2] / 2) return true;

// Agrupa los elementos por cercanía: cada zona de trabajo (cocina, baño, fachada…) sale en su propia página.

// Modo automático: quita lo que casi seguro es un accidente (trazos gigantes o con puntos inválidos) y las

    const speck = z.length <= 2 && z.every(it => { const b = bounds(it); return it.t === 's' && Math.hypot(b[2] - b[0], b[3] - b[1]) < 80; });

function clusterItems(list) {

const sleep = ms => new Promise(r => setTimeout(r, ms));
const step = t => { hint.textContent = 'Generando el PDF — ' + t; notifyParent({ type: 'pizarra:progress', step: t }); };
async function buildPdf(region, auto) {
  const { jsPDF } = window.jspdf;
  step('paso 1 de 4: preparando las fotos…');
  await Promise.race([Promise.all(pendingLoads), sleep(6000)]);                       // si el almacenamiento no responde, no esperar para siempre
  await Promise.race([Promise.all(items.filter(i => i.t === 'p' && i.src).map(ensureImg)), sleep(8000)]);
  step('paso 2 de 4: calculando el área…');
  const aw0 = auto ? autoWorkItems() : null, src = aw0 ? aw0.list : items, skipped = aw0 ? aw0.skipped : 0;
  if (!src.length) throw new Error('no hay trabajo que exportar');
  const zones = region
    ? [(() => { const b = [Math.min(region[0], region[2]), Math.min(region[1], region[3]), Math.max(region[0], region[2]), Math.max(region[1], region[3])], W = b[2] - b[0], H = b[3] - b[1]; return { b, W, H, land: W >= H }; })()]

  line(`Elementos: ${cnt('m')} medidas, ${cnt('p')} fotos, ${cnt('t')} notas de texto, ${cnt('s') + cnt('l') + cnt('g') + cnt('e')} trazos y formas`, 10.5, false, 14);

let exportStart = 0;
async function exportPdf(opts) {
