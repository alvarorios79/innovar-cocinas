<title>Pizarra del Medidor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Diseño: barra de herramientas arriba, hoja cuadriculada que ocupa el resto, línea de ayuda al pie.
   La hoja siempre es papel blanco con cuadrícula azul, igual en tema claro u oscuro. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --fg: #17222d; --muted: #56667a; --line: #cfd8e1;
  --accent: #0b62c4; --accent-fg: #ffffff; --accent-soft: #dbeafb; --danger: #b3261e;
  --paper: #ffffff; --grid-minor: #d6e4f2; --grid-major: #a9c4de;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161c; --panel: #1a232c; --fg: #e6edf4; --muted: #9aaabb; --line: #2c3945;
    --accent: #5aa9f2; --accent-fg: #071522; --accent-soft: #1c3450; --danger: #f2867e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161c; --panel: #1a232c; --fg: #e6edf4; --muted: #9aaabb; --line: #2c3945;
  --accent: #5aa9f2; --accent-fg: #071522; --accent-soft: #1c3450; --danger: #f2867e;
  color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.35 var(--font-ui);
  display: flex; flex-direction: column; gap: 8px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.bar, .scalebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.grp.end { margin-left: auto; }
.btn {
  min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); font: 500 14px var(--font-ui); cursor: pointer;
  touch-action: manipulation;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.scalebar input[type="text"] {
  height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font: 500 14px var(--font-ui); padding: 0 10px; width: 210px; -webkit-user-select: text; user-select: text;
}
.scalebar input#who { width: 140px; }
.btn.sm { min-height: 36px; padding: 0 12px; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw {
  width: 44px; height: 44px; border-radius: 10px; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.sw i { width: 26px; height: 26px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sz { width: 44px; padding: 0; display: grid; place-items: center; }
.sz i { width: var(--d); height: var(--d); border-radius: 50%; background: currentColor; }
.scalebar { font-size: 13px; color: var(--muted); }
.scalebar label { display: inline-flex; align-items: center; gap: 6px; }
.scalebar input[type="number"], .scalebar select {
  height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font: 500 14px var(--font-num); padding: 0 8px;
}
.scalebar input[type="number"] { width: 78px; }
.scalebar input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.grow { flex: 1; }
.num { font-family: var(--font-num); min-width: 3.4em; text-align: center; color: var(--fg); }
#board {
  position: relative; flex: 1; min-height: 240px; border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden; background: var(--paper);
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
#txt {
  position: absolute; z-index: 3; min-width: 120px; padding: 2px 6px; border-radius: 6px;
  border: 1.5px dashed var(--accent); background: rgba(255,255,255,.94); color: #111827;
  font-family: var(--font-ui); font-weight: 600; outline: none; -webkit-user-select: text; user-select: text;
}
#txt.m { font-family: var(--font-num); text-align: center; transform: translate(-50%, -50%); width: 120px; }
#hint { font-size: 13px; color: var(--muted); min-height: 1.35em; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="bar" role="toolbar" aria-label="Herramientas de la pizarra">
  <div class="grp" role="group" aria-label="Herramienta">
    <button class="btn" data-tool="pen" aria-pressed="true">Lápiz</button>
    <button class="btn" data-tool="line" aria-pressed="false">Recta</button>
    <button class="btn" data-tool="measure" aria-pressed="false">Medir</button>
    <button class="btn" data-tool="text" aria-pressed="false">Texto</button>
    <button class="btn" data-tool="erase" aria-pressed="false">Borrar</button>
    <button class="btn" data-tool="move" aria-pressed="false">Mover</button>
    <button class="btn" data-tool="hand" aria-pressed="false">Mano</button>
  </div>
  <div class="grp" role="group" aria-label="Color">
    <button class="sw" data-color="#111827" style="--c:#111827" aria-label="Negro" aria-pressed="true"><i></i></button>
    <button class="sw" data-color="#d92d20" style="--c:#d92d20" aria-label="Rojo" aria-pressed="false"><i></i></button>
    <button class="sw" data-color="#1769d1" style="--c:#1769d1" aria-label="Azul" aria-pressed="false"><i></i></button>
    <button class="sw" data-color="#12805c" style="--c:#12805c" aria-label="Verde" aria-pressed="false"><i></i></button>
    <button class="sw" data-color="#b54708" style="--c:#b54708" aria-label="Naranja" aria-pressed="false"><i></i></button>
  </div>
  <div class="grp" role="group" aria-label="Grosor">
    <button class="btn sz" data-size="2" style="--d:4px" aria-label="Fino" aria-pressed="false"><i></i></button>
    <button class="btn sz" data-size="4" style="--d:8px" aria-label="Medio" aria-pressed="true"><i></i></button>
    <button class="btn sz" data-size="8" style="--d:14px" aria-label="Grueso" aria-pressed="false"><i></i></button>
  </div>
  <div class="grp" role="group" aria-label="Fotos">
    <button class="btn" id="shoot">Tomar foto</button>
    <button class="btn" id="gallery">Galería</button>
    <button class="btn danger" id="delSel" hidden>Quitar selección</button>
  </div>
  <div class="grp end" role="group" aria-label="Edición">
    <button class="btn primary" id="exportPdf" disabled>Exportar PDF</button>
    <button class="btn" id="undo" disabled>Deshacer</button>
    <button class="btn" id="redo" disabled>Rehacer</button>
    <button class="btn danger" id="clear">Limpiar</button>
  </div>
</header>

<div class="scalebar">
  <label for="job">Cliente / trabajo <input id="job" type="text" maxlength="80" placeholder="Ej. Casa Pérez, cocina" autocomplete="off"></label>
  <label for="who">Medidor <input id="who" type="text" maxlength="60" placeholder="Nombre" autocomplete="off"></label>
</div>
<div class="scalebar">
  <label for="cell">1 cuadro =
    <input id="cell" type="number" inputmode="decimal" min="0.01" step="0.05" value="0.5">
    <select id="unit" aria-label="Unidad"><option value="m">m</option><option value="cm">cm</option></select>
  </label>
  <label><input type="checkbox" id="snap" checked> Rectas y medidas a la cuadrícula</label>
  <label><input type="checkbox" id="holdOn" checked> Formas perfectas al mantener</label>
  <label><input type="checkbox" id="finger"> Dibujar con el dedo</label>
  <span class="grow"></span>
  <button class="btn sm" id="zout" aria-label="Alejar">−</button>
  <span class="num" id="zoomLbl">100%</span>
  <button class="btn sm" id="zin" aria-label="Acercar">+</button>
  <button class="btn sm" id="fit">Ajustar vista</button>
</div>

<main id="board">
  <canvas id="cv" aria-label="Hoja de trabajo cuadriculada"></canvas>
  <input id="txt" type="text" hidden autocomplete="off" autocapitalize="sentences" aria-label="Texto de la anotación">
</main>
<div id="hint" role="status"></div>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const cv = $('#cv'), board = $('#board'), txt = $('#txt');
let ctx = cv.getContext('2d');
const hint = $('#hint'), zoomLbl = $('#zoomLbl'), delBtn = $('#delSel');
const CELL = 40, MAJOR = 5, KEY = 'pizarra-medidor-v1';
const TEXT_SIZES = { 2: 18, 4: 26, 8: 38 };
const HINTS = {
  pen: 'Lápiz: dibuja con el Apple Pencil o el mouse. Al terminar un trazo, mantén el lápiz quieto y se endereza en recta, rectángulo, triángulo o círculo. Un dedo mueve la hoja y dos dedos acercan.',
  line: 'Recta: arrastra de un punto a otro para trazar una línea derecha. Se alinea sola cerca de 0°, 45° y 90°.',
  measure: 'Medir: arrastra de un punto a otro. Al soltar, confirma la medida o escribe la real.',
  text: 'Texto: toca la hoja donde quieras escribir y pulsa Enter.',
  erase: 'Borrar: pasa sobre trazos, medidas o textos. Las fotos se quitan con Mover y «Quitar selección».',
  move: 'Mover: arrastra cualquier elemento. En una foto seleccionada, la esquina inferior derecha cambia su tamaño.',
  hand: 'Mano: arrastra para desplazar la hoja. Con dos dedos puedes acercar y alejar.'
};
const CURS = { pen: 'crosshair', line: 'crosshair', measure: 'crosshair', text: 'text', erase: 'cell', move: 'default', hand: 'grab' };

let view = { x: 24, y: 24, k: 1 }, items = [], hist = [], redoS = [];
let tool = 'pen', color = '#111827', size = 4, cellVal = 0.5, unit = 'm', snap = true, fingerDraw = false;
let cur = null, sel = null, drag = null, nav = null, eraseRing = null, txtState = null;
let penDown = false, lastPen = 0, dpr = 1, raf = 0, saveT = 0, confirmT = 0;
let holdOn = true, holdT = 0, holdAnchor = null, holdShape = false;
let job = '', who = '', DL = null, exporting = false, exportNum = null;
let T = { accent: '#0b62c4', paper: '#fff', minor: '#d6e4f2', major: '#a9c4de', num: 'monospace', ui: 'sans-serif' };
const ptrs = new Map(), imgs = new Map();

/* ---------- utilidades ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = n => n.toLocaleString('es', { maximumFractionDigits: 2 });
const segDist = (px, py, ax, ay, bx, by) => {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
};
function readTheme() {
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  T = { accent: g('--accent'), paper: g('--paper'), minor: g('--grid-minor'), major: g('--grid-major'), num: g('--font-num'), ui: g('--font-ui') };
  schedule();
}
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }
function measureLabel(a, b) {
  const v = Math.hypot(b[0] - a[0], b[1] - a[1]) / CELL * cellVal;
  return fmt(v) + ' ' + unit;
}
const toWorld = (sx, sy) => [(sx - view.x) / view.k, (sy - view.y) / view.k];
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function snapPt(p) { return snap ? [Math.round(p[0] / CELL) * CELL, Math.round(p[1] / CELL) * CELL] : p; }
function textFont(fs) { return `600 ${fs}px ${T.ui}`; }

/* ---------- geometría de elementos ---------- */
function bounds(it) {
  if (it.t === 's') {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const q of it.p) { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
    const w = it.p[0][2]; return [x0 - w, y0 - w, x1 + w, y1 + w];
  }
  if (it.t === 'm') return [Math.min(it.a[0], it.b[0]) - 8, Math.min(it.a[1], it.b[1]) - 8, Math.max(it.a[0], it.b[0]) + 8, Math.max(it.a[1], it.b[1]) + 8];
  if (it.t === 'l' || it.t === 'g') {
    const xs = it.p.map(q => q[0]), ys = it.p.map(q => q[1]);
    return [Math.min(...xs) - it.w, Math.min(...ys) - it.w, Math.max(...xs) + it.w, Math.max(...ys) + it.w];
  }
  if (it.t === 'e') return [it.x - it.rx - it.w, it.y - it.ry - it.w, it.x + it.rx + it.w, it.y + it.ry + it.w];
  if (it.t === 't') { ctx.font = textFont(it.fs); const w = ctx.measureText(it.s).width; return [it.x - 4, it.y - it.fs, it.x + w + 4, it.y + it.fs * 0.3]; }
  return [it.x, it.y, it.x + it.w, it.y + it.h];
}
function hit(it, x, y, tol) {
  if (it.t === 's') {
    const p = it.p;
    if (p.length === 1) return Math.hypot(x - p[0][0], y - p[0][1]) <= tol + p[0][2] / 2;
    for (let i = 1; i < p.length; i++) if (segDist(x, y, p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]) <= tol + p[i][2] / 2) return true;
    return false;
  }
  if (it.t === 'm') return segDist(x, y, it.a[0], it.a[1], it.b[0], it.b[1]) <= tol + 3;
  if (it.t === 'l' || it.t === 'g') {
    const p = it.p, n = it.t === 'g' ? p.length : p.length - 1;
    for (let i = 0; i < n; i++) { const a = p[i], b = p[(i + 1) % p.length]; if (segDist(x, y, a[0], a[1], b[0], b[1]) <= tol + it.w / 2) return true; }
    return false;
  }
  if (it.t === 'e') {
    const nx = (x - it.x) / it.rx, ny = (y - it.y) / it.ry;
    return Math.abs(Math.hypot(nx, ny) - 1) * Math.min(it.rx, it.ry) <= tol + it.w / 2;
  }
  const b = bounds(it); return x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3];
}
function moved(it, dx, dy) {
  if (it.t === 's') return { ...it, p: it.p.map(q => [q[0] + dx, q[1] + dy, q[2]]) };
  if (it.t === 'm') return { ...it, a: [it.a[0] + dx, it.a[1] + dy], b: [it.b[0] + dx, it.b[1] + dy] };
  if (it.t === 'l' || it.t === 'g') return { ...it, p: it.p.map(q => [q[0] + dx, q[1] + dy]) };
  return { ...it, x: it.x + dx, y: it.y + dy };
}

/* ---------- dibujo ---------- */
function resize() {
  dpr = Math.max(1, window.devicePixelRatio || 1);
  const w = board.clientWidth, h = board.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  schedule();
}
function drawGrid(w, h) {
  const step = CELL * view.k;
  const x0 = Math.floor(-view.x / view.k / CELL), x1 = Math.ceil((w - view.x) / view.k / CELL);
  const y0 = Math.floor(-view.y / view.k / CELL), y1 = Math.ceil((h - view.y) / view.k / CELL);
  ctx.lineWidth = 1;
  for (const major of [false, true]) {
    if (!major && step < 9) continue;
    ctx.strokeStyle = major ? T.major : T.minor; ctx.beginPath();
    for (let i = x0; i <= x1; i++) { if ((i % MAJOR === 0) !== major) continue; const sx = Math.round(i * step + view.x) + .5; ctx.moveTo(sx, 0); ctx.lineTo(sx, h); }
    for (let j = y0; j <= y1; j++) { if ((j % MAJOR === 0) !== major) continue; const sy = Math.round(j * step + view.y) + .5; ctx.moveTo(0, sy); ctx.lineTo(w, sy); }
    ctx.stroke();
  }
}
function drawStroke(s) {
  const p = s.p; ctx.strokeStyle = s.c; ctx.fillStyle = s.c; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], p[0][2] / 2, 0, 7); ctx.fill(); return; }
  if (p.length === 2) { ctx.lineWidth = (p[0][2] + p[1][2]) / 2; ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); ctx.lineTo(p[1][0], p[1][1]); ctx.stroke(); return; }
  let prev = [p[0][0], p[0][1]];
  for (let i = 1; i < p.length - 1; i++) {
    const mid = [(p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2];
    ctx.lineWidth = (p[i][2] + p[i + 1][2]) / 2; ctx.beginPath(); ctx.moveTo(prev[0], prev[1]);
    ctx.quadraticCurveTo(p[i][0], p[i][1], mid[0], mid[1]); ctx.stroke(); prev = mid;
  }
  const l = p[p.length - 1]; ctx.lineWidth = l[2]; ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(l[0], l[1]); ctx.stroke();
}
function pill(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawMeasure(m) {
  const [ax, ay] = m.a, [bx, by] = m.b, k = view.k;
  ctx.strokeStyle = m.c; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  const ang = Math.atan2(by - ay, bx - ax), nx = -Math.sin(ang) * 8, ny = Math.cos(ang) * 8;
  ctx.beginPath(); ctx.moveTo(ax - nx, ay - ny); ctx.lineTo(ax + nx, ay + ny); ctx.moveTo(bx - nx, by - ny); ctx.lineTo(bx + nx, by + ny); ctx.stroke();
  const fs = 13 / k; ctx.font = `500 ${fs}px ${T.num}`;
  const label = exportNum && exportNum.has(m) ? exportNum.get(m) + ' · ' + m.label : m.label;
  const tw = ctx.measureText(label).width, ph = fs * 1.7, pw = tw + fs, cx = (ax + bx) / 2, cy = (ay + by) / 2;
  pill(cx - pw / 2, cy - ph / 2, pw, ph, ph / 2);
  ctx.fillStyle = 'rgba(255,255,255,.93)'; ctx.fill(); ctx.strokeStyle = m.c; ctx.lineWidth = 1.2 / k; ctx.stroke();
  ctx.fillStyle = '#111827'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, cx, cy + fs * 0.05);
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}
function drawPhoto(p) {
  if (!p.src) { ctx.fillStyle = '#e5e7eb'; ctx.fillRect(p.x, p.y, p.w, p.h); return; } // cargando desde IndexedDB
  let im = imgs.get(p.id);
  if (!im) { im = new Image(); im.onload = schedule; im.src = p.src; imgs.set(p.id, im); }
  if (im.complete && im.naturalWidth) ctx.drawImage(im, p.x, p.y, p.w, p.h);
  else { ctx.fillStyle = '#e5e7eb'; ctx.fillRect(p.x, p.y, p.w, p.h); }
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1 / view.k; ctx.strokeRect(p.x, p.y, p.w, p.h);
}
function drawShape(it) {
  ctx.strokeStyle = it.c; ctx.lineWidth = it.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  if (it.t === 'e') ctx.ellipse(it.x, it.y, it.rx, it.ry, 0, 0, Math.PI * 2);
  else { it.p.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); if (it.t === 'g') ctx.closePath(); }
  ctx.stroke();
}
function drawItem(it) {
  if (it.t === 'l' || it.t === 'g' || it.t === 'e') drawShape(it);
  else if (it.t === 's') drawStroke(it);
  else if (it.t === 'm') drawMeasure(it);
  else if (it.t === 't') { ctx.font = textFont(it.fs); ctx.fillStyle = it.c; ctx.fillText(it.s, it.x, it.y); }
  else if (it.t === 'p') drawPhoto(it);
}
function draw() {
  const w = board.clientWidth, h = board.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = T.paper; ctx.fillRect(0, 0, w, h);
  drawGrid(w, h);
  ctx.setTransform(dpr * view.k, 0, 0, dpr * view.k, dpr * view.x, dpr * view.y);
  for (const it of items) drawItem(it);
  if (cur) drawItem(cur);

/* ---------- exportar a PDF ---------- */
const MB = 1048576;
const slug = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
const ensureImg = p => new Promise(res => {
  let im = imgs.get(p.id);
  if (!im) { im = new Image(); imgs.set(p.id, im); im.src = p.src; }
  if (im.complete && im.naturalWidth) return res();
  im.addEventListener('load', () => res(), { once: true }); im.addEventListener('error', () => res(), { once: true });
});
function contentBounds() {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of items) { const b = bounds(it); x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]); }
  x0 = Math.floor((x0 - CELL) / CELL) * CELL; y0 = Math.floor((y0 - CELL) / CELL) * CELL;
  x1 = Math.ceil((x1 + CELL) / CELL) * CELL; y1 = Math.ceil((y1 + CELL) / CELL) * CELL;
  if (x1 - x0 < CELL * 8) x1 = x0 + CELL * 8;
  if (y1 - y0 < CELL * 6) y1 = y0 + CELL * 6;
  return [x0, y0, x1, y1];
}
function drawGridWorld(b, s) {
  for (const major of [false, true]) {
    ctx.strokeStyle = major ? T.major : T.minor; ctx.lineWidth = (major ? 1.8 : 1.2) / s; ctx.beginPath();
    for (let i = Math.ceil(b[0] / CELL); i * CELL <= b[2]; i++) { if ((i % MAJOR === 0) !== major) continue; ctx.moveTo(i * CELL, b[1]); ctx.lineTo(i * CELL, b[3]); }
    for (let j = Math.ceil(b[1] / CELL); j * CELL <= b[3]; j++) { if ((j % MAJOR === 0) !== major) continue; ctx.moveTo(b[0], j * CELL); ctx.lineTo(b[2], j * CELL); }
    ctx.stroke();
  }
}
function renderBoard(b, pxW) {
  const W = b[2] - b[0], H = b[3] - b[1], s = pxW / W, c = document.createElement('canvas');
  c.width = Math.round(pxW); c.height = Math.round(H * s);
  const prevCtx = ctx, prevView = view;
  try {
    ctx = c.getContext('2d'); view = { x: 0, y: 0, k: Math.min(1, 1100 / W) }; // el rótulo de cada medida conserva un tamaño legible
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.setTransform(s, 0, 0, s, -b[0] * s, -b[1] * s);
    drawGridWorld(b, s);
    for (const it of items) drawItem(it);
  } finally { ctx = prevCtx; view = prevView; }
  return c;
}
async function buildPdf() {
  const { jsPDF } = window.jspdf;
  await Promise.all(pendingLoads);
  await Promise.all(items.filter(i => i.t === 'p' && i.src).map(ensureImg));
  exportNum = new Map(); let n = 0; for (const it of items) if (it.t === 'm') exportNum.set(it, ++n);
  const b = contentBounds(), W = b[2] - b[0], H = b[3] - b[1], land = W >= H;
  const pw = land ? 841.89 : 595.28, ph = land ? 595.28 : 841.89, M = 28, headH = 50;
  const aw = pw - 2 * M, ah = ph - 2 * M - headH - 14;
  let iw = aw, ih = iw * H / W; if (ih > ah) { ih = ah; iw = ih * W / H; }
  // Escalera de calidad: de la mejor a la más liviana; cada peldaño acepta un tamaño máximo (MB) para la imagen.
  const ladder = [[300, 0.9, 2.4], [300, 0.85, 2.4], [250, 0.9, 2.4], [250, 0.85, 2.3], [220, 0.85, 2.2], [200, 0.82, 2.0], [180, 0.8, 2.0], [150, 0.75, 2.0]];
  let canvas = null, canvasDpi = 0, pick = null;
  for (const [dpi, q, lim] of ladder) {
    if ((iw * dpi / 72) * (ih * dpi / 72) > 12e6) continue; // límite de memoria de lienzo en tablets
    if (canvasDpi !== dpi) { canvas = renderBoard(b, Math.round(iw * dpi / 72)); canvasDpi = dpi; await new Promise(r => setTimeout(r, 0)); }
    const url = canvas.toDataURL('image/jpeg', q), bytes = Math.round((url.length - 23) * 0.75);
    pick = { url, bytes, dpi, q }; if (bytes <= lim * MB) break;
  }
  const when = new Date().toLocaleString('es', { dateStyle: 'long', timeStyle: 'short' });
  const scaleTxt = `1 cuadro = ${fmt(cellVal)} ${unit}`;
  const doc = new jsPDF({ orientation: land ? 'l' : 'p', unit: 'pt', format: 'a4', compress: true });
  doc.setProperties({ title: job || 'Levantamiento de medidas', subject: 'Levantamiento de medidas', author: who, creator: 'Pizarra del Medidor' });
  doc.setTextColor(23, 34, 45); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  doc.text(job || 'Levantamiento de medidas', M, M + 14);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(86, 102, 122);
  doc.text(`Medidor: ${who || 'sin nombre'}   |   ${when}   |   Escala de la cuadrícula: ${scaleTxt}`, M, M + 30);
  const ix = M + (aw - iw) / 2, iy = M + headH;
  doc.addImage(pick.url, 'JPEG', ix, iy, iw, ih, undefined, 'FAST');
  doc.setDrawColor(190, 200, 212); doc.setLineWidth(0.5); doc.rect(ix, iy, iw, ih);
  // Página de datos
  doc.addPage('a4', 'p'); const DW = 595.28, DH = 841.89; let y = M + 14;
  const line = (text, size, bold, gap, color) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...(color || [23, 34, 45]));
    for (const l of doc.splitTextToSize(String(text), DW - 2 * M)) { if (y > DH - M) { doc.addPage('a4', 'p'); y = M + 14; } doc.text(l, M, y); y += size * 1.35; }
    y += gap || 0;
  };
  const cnt = t => items.filter(i => i.t === t).length;
  line('Datos del levantamiento', 16, true, 8);
  line(`Cliente / trabajo: ${job || 'sin indicar'}`, 10.5, false, 0);
  line(`Medidor: ${who || 'sin indicar'}`, 10.5, false, 0);
  line(`Fecha: ${when}`, 10.5, false, 0);
  line(`Escala de la cuadrícula: ${scaleTxt}`, 10.5, false, 0);
  line(`Elementos: ${cnt('m')} medidas, ${cnt('p')} fotos, ${cnt('t')} notas de texto, ${cnt('s') + cnt('l') + cnt('g') + cnt('e')} trazos y formas`, 10.5, false, 14);
  line('Medidas (el número coincide con la hoja)', 12, true, 4);
  if (!exportNum.size) line('No hay medidas registradas.', 10.5, false, 10, [86, 102, 122]);
  exportNum.forEach((num, m) => line(`${num}.   ${m.label}`, 10.5, false, 0));
  y += 12;
  line('Notas de texto', 12, true, 4);
  const notes = items.filter(i => i.t === 't');
  if (!notes.length) line('No hay notas de texto.', 10.5, false, 0, [86, 102, 122]);
  notes.forEach((t, i) => line(`${i + 1}.   ${t.s}`, 10.5, false, 0));
  const total = doc.getNumberOfPages();
  for (let p = 1; p <= total; p++) { doc.setPage(p); const w = p === 1 ? pw : DW, h = p === 1 ? ph : DH; doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120, 130, 142); doc.text(`Página ${p} de ${total}`, w - M, h - 14, { align: 'right' }); }
  const blob = doc.output('blob');
  const name = `Levantamiento_${slug(job) || 'sin-nombre'}_${new Date().toISOString().slice(0, 10)}.pdf`;
  return { blob, name, dpi: pick.dpi, q: pick.q };
}
async function exportPdf() {
  if (exporting) return;
  commitText(false);
  if (!DL) { hint.textContent = 'Guardar archivos no está disponible en este visor.'; return; }
  if (!window.jspdf) { hint.textContent = 'No se pudo cargar el generador de PDF. Revisa la conexión e inténtalo otra vez.'; return; }
  if (!items.length) { hint.textContent = 'La hoja está vacía: dibuja o mide algo antes de exportar.'; return; }
  exporting = true; const btn = $('#exportPdf'); btn.disabled = true; hint.textContent = 'Generando el PDF…';
  await new Promise(r => setTimeout(r, 30));
  try {
    const r = await buildPdf(), mb = r.blob.size / MB;
    hint.textContent = `PDF listo: ${fmt(mb)} MB a ${r.dpi} ppp. Confirma para guardarlo.`;
    await DL.save({ filename: r.name, data: r.blob });
    hint.textContent = `PDF guardado: ${r.name} (${fmt(mb)} MB).`;
  } catch (e) {
    const c = e && e.code;
    hint.textContent = c === 'declined' ? 'No se guardó el PDF.' : c === 'rate_limited' ? 'Ya hay una confirmación abierta. Respóndela y vuelve a intentar.' : 'No se pudo generar o guardar el PDF' + (e && e.message ? ': ' + e.message : '.');
  } finally { exportNum = null; exporting = false; btn.disabled = !DL; schedule(); }
}
$('#exportPdf').addEventListener('click', exportPdf);
$('#job').addEventListener('input', e => { job = e.target.value; save(); });
$('#who').addEventListener('input', e => { who = e.target.value; save(); });

}
